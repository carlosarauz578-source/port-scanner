name: Port Scanner CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Verificar sintaxis
        run: |
          python -m py_compile scanner.py

      - name: Ejecutar scanner
        run: |
          python scanner.py
