name: Port Scanner CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verificar sintaxis
        run: |
          python -m py_compile scanner.py

      - name: Ejecutar scanner
        run: |
          python scanner.py scanme.nmap.org 20 100

      - name: Mostrar archivos generados
        run: |
          ls -lah

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: port-scan-report
          path: report_*.txt
          if-no-files-found: ignore
